# Waypoint sequence for the PREGRASP scripted arm motion. ALL-ZERO
# PLACEHOLDERS below -- replace each `q` with a real pose authored in
# scripts/pose_slider.py (pose the arm, click "print pose", paste the
# 26-dim array). Then export the interpolated trajectory with:
#
#   python scripts/export_pose_trajectory.py \
#       --waypoints ros2_ws/src/g1_ypf_orchestrator/config/pose_sequences/pregrasp.yaml \
#       --rate 50 --out /tmp/pregrasp_trajectory.yaml
#
# `t` is absolute arrival time in seconds (first waypoint's t is typically 0,
# its pose used as-is, not interpolated into). Order matters: e.g. elbows
# back first so the hands don't sweep across the table on the way to the
# pregrasp standoff pose.
waypoints:
