    t: 0.0
    q: [0.1108, 0.1878, 0.0000, 1.2778, -0.0002, -0.0004, -0.0004, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.1108, -0.1878, -0.0000, 1.2778, 0.0002, -0.0004, 0.0004, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000, 0.0000]
