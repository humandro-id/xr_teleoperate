# Cada paso mueve SOLO ese grupo a esos números. El resto se queda donde está.
# hombros: [pitch, roll, yaw]
# codos: un número
# munecas: [roll, pitch, yaw]
# manos: [thumb, thumb_aux, index, middle, ring, pinky]

steps:

  - name: flexionar_codos
    move_time: 2.0
    codos:
      left: -0.3
      right: -0.3

  - name: hombros_arriba
    move_time: 3.0
    hombros:
      left:  [0.0,  0.5, 0.0]
      right: [0.0, -0.5, 0.0]
  #
  - name: muñecas
    move_time: 2.0
    munecas:
      left:  [0.0,  -0.3, 0.0] # roll, pitch, yaw
      right: [0.0,  -0.3, 0.0] 

  - name: cerrar_manos
    move_time: 1.5
    manos:
      left:  0.8
      right: 0.8
