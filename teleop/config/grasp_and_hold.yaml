    q: [-0.3532, 0.1335, 0.1300, 0.2318, 0.0632, -0.1414, -0.0156, 0.8020, 0.8020, 0.8020, 0.8020, 0.8020, 0.8020, -0.3532, -0.1335, -0.1300, 0.2318, -0.0632, -0.1414, 0.0156, 0.8020, 0.8020, 0.8020, 0.8020, 0.8020, 0.8020]
